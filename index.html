<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Validade</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
</head>
<body>

    <header>
        <h2>Gestor de Validades</h2>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div id="form-container" class="card">
                <h3>Novo Produto</h3>
                <input type="text" id="produto" placeholder="Nome do Produto">
                <input type="date" id="validade">
                <div class="color-picker">
                    <label>Cor do Marcador:</label>
                    <input type="color" id="cor-produto" value="#e74c3c">
                </div>
                <button onclick="salvarProduto()" class="btn-primary">Registrar Vencimento</button>
            </div>

            <div class="card list-section">
                <div class="list-header">
                    <h3>Produtos</h3>
                    <button onclick="toggleLista()" id="btn-toggle" class="btn-sm">Ocultar</button>
                </div>
                
                <div id="lista-produtos"></div>

                <div class="list-actions">
                    <button onclick="selecionarTodos(true)" class="btn-link">Todos</button>
                    <button onclick="selecionarTodos(false)" class="btn-link">Nenhum</button>
                    <button onclick="removerSelecionados()" class="btn-danger">Excluir Selecionados</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div id="calendar" class="card"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
